<!DOCTYPE html>
<html>
<head>
    <title>Electron DB Test</title>
</head>
<body>
    <h1>Electron DB Test Page</h1>
    <div id="status">Checking electronDB...</div>
    <button id="testBtn">Test getTodos</button>
    <pre id="output"></pre>

    <script>
        const statusDiv = document.getElementById('status');
        const outputPre = document.getElementById('output');
        const testBtn = document.getElementById('testBtn');

        // Check if electronDB is available
        console.log('window.electronDB:', window.electronDB);
        console.log('typeof window.electronDB:', typeof window.electronDB);

        if (window.electronDB) {
            statusDiv.textContent = '✅ electronDB is available!';
            statusDiv.style.color = 'green';

            testBtn.addEventListener('click', async () => {
                try {
                    const todos = await window.electronDB.getTodos();
                    outputPre.textContent = JSON.stringify(todos, null, 2);
                } catch (error) {
                    outputPre.textContent = 'Error: ' + error.message;
                    outputPre.style.color = 'red';
                }
            });
        } else {
            statusDiv.textContent = '❌ electronDB is NOT available';
            statusDiv.style.color = 'red';
            testBtn.disabled = true;
        }
    </script>
</body>
</html>
