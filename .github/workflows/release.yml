name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Build and publish for macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run electron:build:mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish for Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run electron:build:win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish for Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run electron:build:linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
