name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project OneList.xcodeproj -scheme OneList -configuration Release \
            -derivedDataPath build MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS=OneList/App/OneList-Local.entitlements ONE_LIST_CLOUDKIT_CONTAINER= \
            build
        # CI has no Apple Developer team: the zip is ad-hoc signed and local-only (no iCloud sync).
        # Builds signed with the team in Xcode sync with the iOS app.

      - name: Package
        run: |
          cd "build/Build/Products/Release"
          ditto -c -k --keepParent "One List.app" "$GITHUB_WORKSPACE/One-List-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "One-List-${GITHUB_REF_NAME}.zip" --generate-notes
